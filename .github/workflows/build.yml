name: build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - run: chmod +x gradlew scripts/*.sh scripts/test-fixtures/*.sh
      - run: ./gradlew --no-daemon --no-problems-report clean build sbom checksums
      - run: node scripts/privacy-audit.mjs
      - run: bash scripts/reproducible-release.sh
