name: build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - run: chmod +x gradlew scripts/*.sh scripts/test-fixtures/*.sh
      - run: ./gradlew --no-daemon --no-problems-report clean build sbom checksums
      - run: node scripts/privacy-audit.mjs
      - run: bash scripts/reproducible-release.sh
